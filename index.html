<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Live Scores</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      background-color: #1e3a5f;
      color: white;
      padding: 20px;
      margin: 0;
    }

    .widget-container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>Team Live Scores</h1>

  <div class="widget-container">
    <a
      style="display:none;"
      class="lsw"
      href="https://www.play-cricket.com/embed_widget/live_scorer_widgets?team_id=362428&days=2"
      id="lsw_link_1526534855799">
    </a>

    <div
      class="lsw-col-12 lsw_tile"
      id="lsw_container_1526534855799">
    </div>
  </div>

  <script type="text/javascript">
    function loadCSSIfNotAlreadyLoadedForSomeReason() {
      var ss = document.styleSheets;
      for (var i = 0, max = ss.length; i < max; i++) {
        if (ss[i].href == "https://www.play-cricket.com/live_scorer.css") return;
      }
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "https://www.play-cricket.com/live_scorer.css";
      document.getElementsByTagName("head")[0].appendChild(link);
    }

    loadCSSIfNotAlreadyLoadedForSomeReason();

    !function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (!d.getElementById(id)) {
        js = d.createElement(s);
        js.id = id;
        js.src = "https://www.play-cricket.com/live_scorer.js";
        fjs.parentNode.insertBefore(js, fjs);
      }
    }(document, "script", "lsw-wjs");
  </script>

</body>
</html>
