<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bracknell Cricket Club - Live Scores (Test)</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
        min-height: 100vh;
        padding: 32px 16px;
      }

      .container {
        margin: 0 auto;
        max-width: 800px;
      }

      header {
        margin-bottom: 24px;
        text-align: center;
      }

      header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      header p {
        color: #6b7280;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        min-height: 320px;
        overflow: hidden;
        padding: 24px;
        width: 100%;
      }

      /* Play-Cricket widget anchor — hidden, used by the widget script */
      .play-cricket-widget-link {
        display: none;
      }

      footer {
        color: #6b7280;
        font-size: 0.85rem;
        margin-top: 20px;
        text-align: center;
      }

      footer a {
        color: #1d4ed8;
        text-decoration: underline;
      }

      footer a:hover {
        color: #1e40af;
      }

      /* ── Status bar (loading / empty) ─────────────────────────────────── */
      #status-message,
      #fallback-message {
        align-items: center;
        border-radius: 8px;
        display: flex;
        font-size: 14px;
        gap: 10px;
        padding: 12px 16px;
      }

      #status-message {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        color: #1d4ed8;
        margin-bottom: 16px;
      }

      #fallback-message {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        color: #6b7280;
        display: none;
      }

      /* ── CSS spinner ──────────────────────────────────────────────────── */
      .spinner {
        animation: spin 0.8s linear infinite;
        border: 3px solid currentColor;
        border-radius: 50%;
        border-top-color: transparent;
        flex-shrink: 0;
        height: 18px;
        opacity: 0.7;
        width: 18px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .status-icon {
        flex-shrink: 0;
        font-size: 18px;
        line-height: 1;
      }

      .status-text {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Bracknell Cricket Club – Live Scores</h1>
        <p>
          Test page for the Play-Cricket live scorer widget.<br />
          Widget data is loaded directly from Play-Cricket using the official embed script.
        </p>
      </header>

      <div class="card">
        <!-- Loading indicator: shown while the widget script is fetching data -->
        <div id="status-message" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span class="status-text">Loading live scores…</span>
        </div>
        <!-- Fallback: shown when the widget returns no live match data -->
        <div id="fallback-message" role="status" aria-live="polite">
          <span class="status-icon" aria-hidden="true">🏏</span>
          <span class="status-text">No live match available</span>
        </div>
        <!--
          Play-Cricket live scorer widget embed.

          The widget script reads this anchor's href to determine which club's
          data to fetch.

          Bracknell Cricket Club ID on Play-Cricket: 1312
        -->
        <a
          class="play-cricket-widget-link"
          href="https://www.play-cricket.com/embed_widget/live_scorer_widgets?club_id=1312&amp;days=0"
        ></a>
      </div>

      <footer>
        <p>
          If the widget does not load,
          <a href="https://www.play-cricket.com/" target="_blank" rel="noopener noreferrer">
            view scores on Play-Cricket
          </a>.
        </p>
      </footer>
    </div>

    <!--
      Official Play-Cricket live scorer widget bootstrapper.
      Loaded dynamically so we can detect whether it renders any live match
      data and show a fallback message when none is available.
    -->
    <script>
      (function () {
        var card = document.querySelector('.card');
        var statusEl = document.getElementById('status-message');
        var fallbackEl = document.getElementById('fallback-message');

        /** Milliseconds to wait for the widget to render before showing the fallback. */
        var CONTENT_TIMEOUT_MS = 4000;

        /** Returns true if the element is part of our own loading/fallback UI (not widget content). */
        function isNonWidgetElement(el) {
          return (
            el.id === 'status-message' ||
            el.id === 'fallback-message' ||
            el.classList.contains('play-cricket-widget-link')
          );
        }

        function hasWidgetContent() {
          return Array.from(card.children).some(function (child) {
            return !isNonWidgetElement(child);
          });
        }

        function hideStatus() {
          statusEl.style.display = 'none';
        }

        function showFallback() {
          statusEl.style.display = 'none';
          fallbackEl.style.display = 'flex';
        }

        var script = document.createElement('script');
        script.src =
          'https://www.play-cricket.com/assets/widget/live_scorer_widget.js';
        script.async = true;

        script.onload = function () {
          // If the widget already rendered synchronously, hide the loading state.
          if (hasWidgetContent()) {
            hideStatus();
            return;
          }

          var done = false;

          // Watch for the widget adding DOM nodes to the card.
          var observer = new MutationObserver(function () {
            if (!done && hasWidgetContent()) {
              done = true;
              observer.disconnect();
              hideStatus();
            }
          });

          observer.observe(card, { childList: true });

          // If nothing is rendered within 4 seconds, treat as "no live match".
          setTimeout(function () {
            if (!done) {
              done = true;
              observer.disconnect();
              showFallback();
            }
          }, CONTENT_TIMEOUT_MS);
        };

        script.onerror = function () {
          showFallback();
        };

        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
