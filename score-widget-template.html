<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Scores - Widget Template</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #dbe2ea;
        --accent: #1d4ed8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); }
      .shell { margin: 0 auto; max-width: 1060px; padding: clamp(14px, 2.8vw, 28px); }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08); padding: clamp(14px, 2.2vw, 24px); }
      h1 { font-size: clamp(1.35rem, 2.5vw, 1.9rem); margin: 0; }
      .subtitle { color: var(--muted); line-height: 1.55; margin: 8px 0 18px; }
      .status { align-items: center; border-radius: 10px; display: none; gap: 10px; margin-bottom: 14px; padding: 11px 14px; }
      .status.loading { background: #eef4ff; border: 1px solid #c4d6ff; color: #1e40af; display: flex; }
      .status.error { background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; display: flex; }
      .status.empty { background: #f8fafc; border: 1px solid var(--border); color: var(--muted); display: flex; }
      .spinner { animation: spin 0.9s linear infinite; border: 3px solid currentColor; border-radius: 999px; border-top-color: transparent; height: 16px; width: 16px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #widget-root { min-height: 360px; overflow: hidden; width: 100%; }
      .help { color: var(--muted); font-size: 0.92rem; margin-top: 14px; }
      .help a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main class="shell" aria-label="Live scores widget panel">
      <section class="panel">
        <h1 id="title">Live Scores</h1>
        <p id="subtitle" class="subtitle">Follow club, team, and division scores in one place.</p>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="widget-root" aria-label="Play-Cricket live scores widget"></div>
        <p class="help">If scores are not currently available, there may be no live match in progress. <a href="https://www.play-cricket.com/" target="_blank" rel="noopener noreferrer">Open Play-Cricket</a></p>
      </section>
    </main>

    <script>
      const CONFIG = {
        title: 'Replace me',
        subtitle: 'Edit this subtitle',
        widgetType: 'club', // club | team | division
        clubId: '1312',
        teamId: '',
        divisionId: '',
        days: 0,
        theme: { accent: '#1d4ed8' }
      };

      const BASE = 'https://www.play-cricket.com/embed_widget/live_scorer_widgets';
      const CSS = 'https://www.play-cricket.com/assets/widget/live_scorer_widget.css';
      const SCRIPT = 'https://www.play-cricket.com/assets/widget/live_scorer_widget.js';
      const CSS_ID = 'play-cricket-widget-css';
      const SCRIPT_ID = 'play-cricket-widget-script';

      const titleEl = document.getElementById('title');
      const subtitleEl = document.getElementById('subtitle');
      const statusEl = document.getElementById('status');
      const widgetRootEl = document.getElementById('widget-root');

      const clean = (value) => String(value || '').replace(/\s+/g, '').trim();
      const cleanValue = (value) => String(value || '').trim();

      const setStatus = (kind, text) => {
        statusEl.className = 'status ' + kind;
        statusEl.innerHTML = kind === 'loading'
          ? '<span class="spinner" aria-hidden="true"></span><span>' + text + '</span>'
          : '<span aria-hidden="true">' + (kind === 'error' ? '⚠️' : '🏏') + '</span><span>' + text + '</span>';
      };

      const hideStatus = () => {
        statusEl.className = 'status';
        statusEl.textContent = '';
      };

      function buildUrl() {
        const type = cleanValue(CONFIG.widgetType).toLowerCase();
        const params = new URLSearchParams();
        if (type === 'club') params.set('club_id', cleanValue(CONFIG.clubId));
        else if (type === 'team') params.set('team_id', cleanValue(CONFIG.teamId));
        else if (type === 'division') params.set('division_id', cleanValue(CONFIG.divisionId));
        else throw new Error('widgetType must be club, team, or division.');
        params.set('days', String(Number.isFinite(Number(CONFIG.days)) ? Number(CONFIG.days) : 0));
        return clean(BASE) + '?' + params.toString();
      }

      function injectCssOnce() {
        if (document.getElementById(CSS_ID)) return;
        const link = document.createElement('link');
        link.id = CSS_ID;
        link.rel = 'stylesheet';
        link.href = clean(CSS);
        document.head.appendChild(link);
      }

      function loadScriptOnce() {
        const existing = document.getElementById(SCRIPT_ID);
        if (existing) {
          if (existing.dataset.loaded === 'true') return Promise.resolve();
          return new Promise((resolve, reject) => {
            existing.addEventListener('load', () => resolve(), { once: true });
            existing.addEventListener('error', () => reject(new Error('Failed to load Play-Cricket script.')), {
              once: true
            });
          });
        }
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.id = SCRIPT_ID;
          script.async = true;
          script.src = clean(SCRIPT);
          script.onload = () => {
            script.dataset.loaded = 'true';
            resolve();
          };
          script.onerror = () => reject(new Error('Failed to load Play-Cricket script.'));
          document.body.appendChild(script);
        });
      }

      async function init() {
        titleEl.textContent = CONFIG.title || 'Live Scores';
        subtitleEl.textContent = CONFIG.subtitle || '';
        if (CONFIG.theme && CONFIG.theme.accent) {
          document.documentElement.style.setProperty('--accent', CONFIG.theme.accent);
        }

        setStatus('loading', 'Loading live scores…');

        try {
          injectCssOnce();

          const widgetEl = document.createElement('div');
          widgetEl.className = 'play-cricket-widget';
          widgetEl.setAttribute('data-src', buildUrl());
          widgetRootEl.innerHTML = '';
          widgetRootEl.appendChild(widgetEl);

          await loadScriptOnce();

          let done = false;
          const observer = new MutationObserver(() => {
            if (!done && (widgetEl.children.length || widgetEl.textContent.trim())) {
              done = true;
              observer.disconnect();
              clearTimeout(timeout);
              hideStatus();
            }
          });
          observer.observe(widgetEl, { childList: true, subtree: true, characterData: true });

          const timeout = setTimeout(() => {
            if (!done && !widgetEl.children.length && !widgetEl.textContent.trim()) {
              done = true;
              observer.disconnect();
              setStatus('empty', 'No live match available right now.');
            }
          }, 5000);
        } catch (error) {
          setStatus('error', error.message || 'Unable to load live scores right now.');
        }
      }

      init();
    </script>
  </body>
</html>
