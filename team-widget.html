<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Scores - Team Widget</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #dbe2ea;
        --accent: #1d4ed8;
        --error-bg: #fff1f2;
        --error-border: #fecdd3;
        --error-text: #be123c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .shell {
        margin: 0 auto;
        max-width: 1060px;
        padding: clamp(14px, 2.8vw, 28px);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
        padding: clamp(14px, 2.2vw, 24px);
      }

      h1 {
        font-size: clamp(1.35rem, 2.5vw, 1.9rem);
        margin: 0;
      }

      .subtitle {
        color: var(--muted);
        line-height: 1.55;
        margin: 8px 0 18px;
      }

      .status {
        align-items: center;
        border-radius: 10px;
        display: none;
        gap: 10px;
        margin-bottom: 14px;
        padding: 11px 14px;
      }

      .status.loading {
        background: #eef4ff;
        border: 1px solid #c4d6ff;
        color: #1e40af;
        display: flex;
      }

      .status.error {
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        color: var(--error-text);
        display: flex;
      }

      .status.empty {
        background: #f8fafc;
        border: 1px solid var(--border);
        color: var(--muted);
        display: flex;
      }

      .spinner {
        animation: spin 0.9s linear infinite;
        border: 3px solid currentColor;
        border-radius: 999px;
        border-top-color: transparent;
        height: 16px;
        width: 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #widget-root {
        min-height: 360px;
        overflow: hidden;
        width: 100%;
      }

      .help {
        color: var(--muted);
        font-size: 0.92rem;
        margin-top: 14px;
      }

      .help a {
        color: var(--accent);
      }

      @media (max-width: 640px) {
        #widget-root {
          min-height: 430px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-label="Live scores widget panel">
      <section class="panel">
        <h1 id="title">Live Scores</h1>
        <p id="subtitle" class="subtitle">Follow club, team, and division scores in one place.</p>

        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="widget-root" aria-label="Play-Cricket live scores widget"></div>

        <p class="help">
          If scores are not currently available, there may be no live match in progress.
          <a href="https://www.play-cricket.com/" target="_blank" rel="noopener noreferrer">Open Play-Cricket</a>
        </p>
      </section>
    </main>

    <script>
      const CONFIG = {
        title: '1st XI',
        subtitle: 'Live scores for this selected team.',
        widgetType: 'team',
        clubId: '',
        teamId: 'YOUR_TEAM_ID', // Replace with your Play-Cricket team ID.
        divisionId: '',
        days: 0,
        theme: {
          accent: '#1d4ed8'
        }
      };

      const WIDGET_BASE_URL = 'https://www.play-cricket.com/embed_widget/live_scorer_widgets';
      const WIDGET_CSS_URL = 'https://www.play-cricket.com/assets/widget/live_scorer_widget.css';
      const WIDGET_SCRIPT_URL = 'https://www.play-cricket.com/assets/widget/live_scorer_widget.js';
      const WIDGET_CSS_ID = 'play-cricket-widget-css';
      const WIDGET_SCRIPT_ID = 'play-cricket-widget-script';
      const WIDGET_TIMEOUT_MS = 5000;

      const titleEl = document.getElementById('title');
      const subtitleEl = document.getElementById('subtitle');
      const statusEl = document.getElementById('status');
      const widgetRootEl = document.getElementById('widget-root');

      function normalizeUrl(url) {
        return String(url || '').replace(/\s+/g, '').trim();
      }

      function normalizeValue(value) {
        return String(value || '').trim();
      }

      function applyConfigToHeader() {
        titleEl.textContent = CONFIG.title || 'Live Scores';
        subtitleEl.textContent = CONFIG.subtitle || '';
        if (CONFIG.theme && CONFIG.theme.accent) {
          document.documentElement.style.setProperty('--accent', CONFIG.theme.accent);
        }
      }

      function setStatus(kind, text) {
        statusEl.className = 'status ' + kind;
        statusEl.innerHTML = kind === 'loading'
          ? '<span class="spinner" aria-hidden="true"></span><span>' + text + '</span>'
          : '<span aria-hidden="true">' + (kind === 'error' ? '⚠️' : '🏏') + '</span><span>' + text + '</span>';
      }

      function hideStatus() {
        statusEl.className = 'status';
        statusEl.textContent = '';
      }

      function buildWidgetUrl() {
        const type = normalizeValue(CONFIG.widgetType).toLowerCase();
        const params = new URLSearchParams();

        if (type === 'club') {
          const clubId = normalizeValue(CONFIG.clubId);
          if (!clubId) throw new Error('clubId is required when widgetType is club.');
          params.set('club_id', clubId);
        } else if (type === 'team') {
          const teamId = normalizeValue(CONFIG.teamId);
          if (!teamId) throw new Error('teamId is required when widgetType is team.');
          params.set('team_id', teamId);
        } else if (type === 'division') {
          const divisionId = normalizeValue(CONFIG.divisionId);
          if (!divisionId) throw new Error('divisionId is required when widgetType is division.');
          params.set('division_id', divisionId);
        } else {
          throw new Error('widgetType must be one of: club, team, division.');
        }

        const days = Number.isFinite(Number(CONFIG.days)) ? Number(CONFIG.days) : 0;
        params.set('days', String(days));

        return normalizeUrl(WIDGET_BASE_URL) + '?' + params.toString();
      }

      function loadCssOnce() {
        const href = normalizeUrl(WIDGET_CSS_URL);
        if (!href.startsWith('https://')) throw new Error('Widget CSS URL must use https://');
        if (document.getElementById(WIDGET_CSS_ID)) return;

        const link = document.createElement('link');
        link.id = WIDGET_CSS_ID;
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
      }

      function loadScriptOnce() {
        const src = normalizeUrl(WIDGET_SCRIPT_URL);
        if (!src.startsWith('https://')) throw new Error('Widget script URL must use https://');

        const existing = document.getElementById(WIDGET_SCRIPT_ID);
        if (existing) {
          if (existing.dataset.loaded === 'true') return Promise.resolve();
          return new Promise((resolve, reject) => {
            existing.addEventListener('load', () => resolve(), { once: true });
            existing.addEventListener('error', () => reject(new Error('Failed to load widget script.')), {
              once: true
            });
          });
        }

        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.id = WIDGET_SCRIPT_ID;
          script.async = true;
          script.src = src;
          script.addEventListener('load', () => {
            script.dataset.loaded = 'true';
            resolve();
          });
          script.addEventListener('error', () => reject(new Error('Failed to load widget script.')));
          document.body.appendChild(script);
        });
      }

      function hasWidgetContent(widgetEl) {
        return widgetEl.children.length > 0 || widgetEl.textContent.trim().length > 0;
      }

      async function render() {
        applyConfigToHeader();
        widgetRootEl.innerHTML = '';
        setStatus('loading', 'Loading live scores…');

        try {
          const widgetUrl = buildWidgetUrl();
          loadCssOnce();

          const widgetEl = document.createElement('div');
          widgetEl.className = 'play-cricket-widget';
          widgetEl.setAttribute('data-src', widgetUrl);
          widgetRootEl.appendChild(widgetEl);

          await loadScriptOnce();

          if (hasWidgetContent(widgetEl)) {
            hideStatus();
            return;
          }

          await new Promise((resolve) => {
            let done = false;
            const observer = new MutationObserver(() => {
              if (!done && hasWidgetContent(widgetEl)) {
                done = true;
                observer.disconnect();
                hideStatus();
                resolve();
              }
            });

            observer.observe(widgetEl, { childList: true, subtree: true, characterData: true });

            setTimeout(() => {
              if (!done) {
                done = true;
                observer.disconnect();
                setStatus('empty', 'No live match available right now. Please check again soon.');
                resolve();
              }
            }, WIDGET_TIMEOUT_MS);
          });
        } catch (error) {
          setStatus('error', error && error.message ? error.message : 'Unable to load live scores right now.');
          widgetRootEl.innerHTML = '';
        }
      }

      render();
    </script>
  </body>
</html>
