<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play-Cricket Live Scores Widget</title>
    <style>
      /* ── Reset & base ─────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: transparent;
        /* Prevent horizontal scroll inside the Wix HTML Component iframe */
        overflow-x: hidden;
      }

      /* ── Content card ─────────────────────────────────────────────────── */
      /*
        This is the only outer wrapper we style — it gives the widget area
        a polished "card" look that sits naturally inside a Wix site without
        touching Play-Cricket widget internals.
      */
      #card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        /* Reserve vertical space so the page doesn't jump on load */
        min-height: 320px;
        /* Clip child content at the rounded corners */
        overflow: hidden;
        padding: 20px;
        width: 100%;
      }

      /* ── Status bar (loading / error / empty) ─────────────────────────── */
      /*
        Hidden by default; shown via JS by adding a class.
        Uses flexbox so the icon/spinner and text align neatly.
      */
      #status {
        align-items: center;
        border-radius: 8px;
        display: none;
        font-size: 14px;
        gap: 10px;
        line-height: 1.5;
        margin-bottom: 16px;
        padding: 12px 16px;
      }

      #status.loading {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        color: #1d4ed8;
        display: flex;
      }

      #status.error {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #be123c;
        display: flex;
      }

      #status.empty {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        color: #6b7280;
        display: flex;
      }

      /* ── CSS spinner (loading state only) ────────────────────────────── */
      .spinner {
        animation: spin 0.8s linear infinite;
        border: 3px solid currentColor;
        border-radius: 50%;
        border-top-color: transparent;
        flex-shrink: 0;
        height: 18px;
        opacity: 0.7;
        width: 18px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Status content layout ────────────────────────────────────────── */
      .status-icon {
        flex-shrink: 0;
        font-size: 18px;
        line-height: 1;
      }

      .status-text {
        flex: 1;
      }

      /* ── Widget container ─────────────────────────────────────────────── */
      /*
        No min-height here — the card itself provides that.
        overflow: hidden stops any rogue horizontal overflow from the
        Play-Cricket widget internals.
      */
      #widget-container {
        overflow: hidden;
        width: 100%;
      }

      /* ── Responsive tweaks ────────────────────────────────────────────── */
      @media (max-width: 480px) {
        #card {
          border-radius: 8px;
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Outer card: the only element we style to look "native" in Wix -->
    <div id="card">
      <!-- Status bar: loading / error / empty — hidden until needed -->
      <div id="status" role="status" aria-live="polite"></div>
      <!-- Play-Cricket widget renders here -->
      <div id="widget-container"></div>
    </div>

    <script>
      /* ── Constants ───────────────────────────────────────────────────── */
      const WIDGET_BASE_URL =
        'https://www.play-cricket.com/embed_widget/live_scorer_widgets';
      const CSS_URL =
        'https://www.play-cricket.com/assets/widget/live_scorer_widget.css';
      const SCRIPT_SRC =
        'https://www.play-cricket.com/assets/widget/live_scorer_widget.js';
      const CSS_ID = 'play-cricket-widget-css';
      /** Milliseconds to wait for the widget to render before showing the fallback. */
      const CONTENT_TIMEOUT_MS = 4000;

      /* ── DOM refs ────────────────────────────────────────────────────── */
      const statusEl = document.getElementById('status');
      const containerEl = document.getElementById('widget-container');

      /* ── CSS injection (once) ────────────────────────────────────────── */
      function injectCss() {
        if (document.getElementById(CSS_ID)) return;
        const link = document.createElement('link');
        link.id = CSS_ID;
        link.rel = 'stylesheet';
        link.href = CSS_URL;
        document.head.appendChild(link);
      }

      /* ── XSS guard ───────────────────────────────────────────────────── */
      /** Escape a string before inserting it as HTML text. */
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* ── Status helpers ──────────────────────────────────────────────── */
      function showLoading() {
        statusEl.className = 'loading';
        statusEl.innerHTML =
          '<span class="spinner" aria-hidden="true"></span>' +
          '<span class="status-text">Loading live scores…</span>';
        containerEl.innerHTML = '';
      }

      function hideStatus() {
        statusEl.className = '';
        statusEl.innerHTML = '';
      }

      /**
       * Display a polished error banner inside the HTML component.
       * @param {string} message
       */
      function renderError(message) {
        statusEl.className = 'error';
        statusEl.innerHTML =
          '<span class="status-icon" aria-hidden="true">⚠️</span>' +
          '<span class="status-text">' + escapeHtml(message) + '</span>';
        containerEl.innerHTML = '';
      }

      /**
       * Display a friendly empty-state banner.
       * @param {string} message
       */
      function renderEmpty(message) {
        statusEl.className = 'empty';
        statusEl.innerHTML =
          '<span class="status-icon" aria-hidden="true">🏏</span>' +
          '<span class="status-text">' + escapeHtml(message) + '</span>';
        containerEl.innerHTML = '';
      }

      /* ── Config validation ───────────────────────────────────────────── */
      /**
       * Validate the widget configuration received via postMessage.
       * @param {Object} config
       * @returns {{ valid: boolean, reason?: string }}
       */
      function validateConfig(config) {
        if (!config || typeof config !== 'object') {
          return { valid: false, reason: 'No configuration provided.' };
        }

        const type = (config.widgetType || '').toLowerCase();

        if (!['club', 'team', 'division'].includes(type)) {
          return {
            valid: false,
            reason: `Unknown widget type "${config.widgetType}". Expected club, team, or division.`,
          };
        }

        if (type === 'club' && !config.clubId) {
          return { valid: false, reason: 'clubId is required for a club widget.' };
        }

        if (type === 'team' && !config.teamId) {
          return { valid: false, reason: 'teamId is required for a team widget.' };
        }

        if (type === 'division' && !config.divisionId) {
          return {
            valid: false,
            reason: 'divisionId is required for a division widget.',
          };
        }

        return { valid: true };
      }

      /* ── URL builder ─────────────────────────────────────────────────── */
      /**
       * Build the full Play-Cricket widget embed URL.
       * @param {Object} config
       * @returns {string}
       */
      function buildWidgetUrl(config) {
        const params = new URLSearchParams();
        const type = config.widgetType.toLowerCase();
        const days = typeof config.days === 'number' ? config.days : 0;

        if (type === 'club') {
          params.set('club_id', config.clubId);
        } else if (type === 'team') {
          params.set('team_id', config.teamId);
        } else if (type === 'division') {
          params.set('division_id', config.divisionId);
        }

        params.set('days', days);

        return `${WIDGET_BASE_URL}?${params.toString()}`;
      }

      /* ── Widget renderer ─────────────────────────────────────────────── */
      /**
       * Clear any existing widget, then render a new one.
       * @param {Object} config
       */
      function renderWidget(config) {
        // Remove the previous widget script and DOM content
        const oldScript = document.getElementById('play-cricket-widget-script');
        if (oldScript) {
          oldScript.remove();
        }
        containerEl.innerHTML = '';

        // Inject Play-Cricket CSS (idempotent)
        injectCss();

        const widgetUrl = buildWidgetUrl(config);

        // The Play-Cricket embed expects a <div> with a data-src attribute,
        // plus the widget script to bootstrap it.
        const widgetDiv = document.createElement('div');
        widgetDiv.className = 'play-cricket-widget';
        widgetDiv.setAttribute('data-src', widgetUrl);
        containerEl.appendChild(widgetDiv);

        // Inject the Play-Cricket widget bootstrapper script
        const script = document.createElement('script');
        script.id = 'play-cricket-widget-script';
        script.src = SCRIPT_SRC;
        script.async = true;

        script.onload = () => {
          const widgetDiv = containerEl.querySelector('.play-cricket-widget');

          // Guard: widget div should always exist at this point, but be safe.
          if (!widgetDiv) {
            renderEmpty('No live match available');
            return;
          }

          // If the widget already rendered synchronously, hide the loading state.
          if (widgetDiv.children.length > 0 || widgetDiv.textContent.trim().length > 0) {
            hideStatus();
            return;
          }

          let done = false;

          // Watch for the Play-Cricket script populating the widget div.
          const observer = new MutationObserver(() => {
            if (
              !done &&
              (widgetDiv.children.length > 0 || widgetDiv.textContent.trim().length > 0)
            ) {
              done = true;
              observer.disconnect();
              hideStatus();
            }
          });

          observer.observe(widgetDiv, { childList: true, subtree: true, characterData: true });

          // If nothing is rendered within CONTENT_TIMEOUT_MS, treat as "no live match".
          setTimeout(() => {
            if (!done) {
              done = true;
              observer.disconnect();
              renderEmpty('No live match available');
            }
          }, CONTENT_TIMEOUT_MS);
        };

        script.onerror = () => {
          renderError(
            'Failed to load the Play-Cricket widget. Please check your internet connection and try again.'
          );
        };

        document.body.appendChild(script);
      }

      /* ── postMessage listener ────────────────────────────────────────── */
      window.addEventListener('message', (event) => {
        // In a Wix HTML Component, postMessage data arrives as event.data.
        // The Wix platform may wrap the payload; unwrap if necessary.
        let config = event.data;

        if (config && typeof config === 'object' && 'data' in config) {
          config = config.data;
        }

        // Handle an explicit loading signal sent by the Velo page on dropdown change.
        if (config && config.type === 'loading') {
          showLoading();
          return;
        }

        // Ignore internal Wix / browser messages that are not widget configs
        if (!config || typeof config !== 'object' || !('widgetType' in config)) {
          return;
        }

        showLoading();

        const { valid, reason } = validateConfig(config);

        if (!valid) {
          renderError(reason || 'Invalid widget configuration.');
          return;
        }

        renderWidget(config);
      });
    </script>
  </body>
</html>
